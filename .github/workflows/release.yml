# Builds the installable apps and attaches them to a GitHub Release:
#   Windows  -> SignalDesk-<v>-win-x64.exe
#   macOS    -> SignalDesk-<v>-mac-arm64.dmg / -mac-x64.dmg
#   Android  -> SignalDesk-<v>-android.apk
# Run it from the Actions tab ("Run workflow") or push a tag like v1.0.0.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  VITE_DATA_URL: https://raw.githubusercontent.com/${{ github.repository }}/data/latest.json
  VITE_GITHUB_REPO: ${{ github.repository }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned build (no paid certificate)
        run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename
        run: |
          V=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "SignalDesk-${V}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: SignalDesk-*-android.apk
          if-no-files-found: error

  release:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: SignalDesk ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          prerelease: ${{ github.ref_type != 'tag' }}
          files: out/*
          body: |
            **Windows:** download the `.exe` and run it. Windows may show “Windows protected your PC” because the app is not code-signed: click *More info → Run anyway*.
            **Mac:** `arm64` for Apple Silicon (M1–M4), `x64` for Intel. First launch: right-click the app → *Open* (it is not notarised).
            **Android:** download the `.apk` on your phone and open it (allow “install unknown apps” for your browser).
            **iPhone:** open the GitHub Pages link in Safari → Share → *Add to Home Screen*.
